services:
  meilisearch_analytics.user_id:
    class: Drupal\meilisearch_analytics\UserIdResolver
    arguments: ['@current_user', '@request_stack', '@settings']

  meilisearch_analytics.events:
    class: Drupal\meilisearch_analytics\AnalyticsEvents
    arguments: ['@meilisearch_analytics.user_id', '@logger.channel.meilisearch']

  meilisearch_analytics.row_attributes:
    class: Drupal\meilisearch_analytics\RowAttributes
    arguments: ['@page_cache_kill_switch']
