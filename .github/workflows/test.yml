name: Tests

on:
  push:
    branches: [main, 1.x]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: '^11'
            meilisearch: 'v1.54'
          - drupal: '^10.3'
            meilisearch: 'v1.54'
          # Oldest supported Meilisearch.
          - drupal: '^11'
            meilisearch: 'v1.16'
    env:
      # Both are read by compose.yaml; scripts/test.sh builds the image.
      DRUPAL_CORE: ${{ matrix.drupal }}
      MEILISEARCH_VERSION: ${{ matrix.meilisearch }}
    steps:
      - uses: actions/checkout@v4
      - name: Run PHPUnit
        run: scripts/test.sh
